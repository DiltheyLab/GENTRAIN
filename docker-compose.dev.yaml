services:
  redis:
    container_name: gentrain-redis
    image: "redis:alpine"
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
  db:
    container_name: gentrain-db
    image: postgres
    hostname: localhost
    ports:
      - ${DATABASE_PORT}:${DATABASE_PORT}
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data  
    restart: unless-stopped
  backend:
    container_name: gentrain-backend
    image: gentrain-backend
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    entrypoint: /backend/entrypoint-backend.sh
    volumes:
      - type: bind
        source: ./backend
        target: /backend
    depends_on:
      - redis
      - db
    env_file: ".env"
  worker:
    container_name: gentrain-worker
    image: gentrain-backend:latest
    depends_on:
      - redis
    entrypoint: /backend/entrypoint-worker.sh
    volumes:
      - type: bind
        source: ./backend
        target: /backend
    links:
      - redis
  redis-insight:
    container_name: gentrain-redis-insight
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
  pgadmin:
    image: dpage/pgadmin4
    container_name: gentrain-pgadmin
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres-data:
  pgadmin-data:


