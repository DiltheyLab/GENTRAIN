services:
  redis:
    container_name: gentrain-redis
    image: gentrain-redis
    build:
      context: ./redis
      dockerfile: Dockerfile
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    volumes:
      - ./redis/tls:/usr/local/etc/redis/tls
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
  redis-insight:
    container_name: gentrain-redis-insight
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
  db:
    container_name: gentrain-db
    image: postgres
    user: postgres:postgres
    ports:
      - ${DATABASE_PORT}:${DATABASE_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    restart: unless-stopped
  backend:
    container_name: gentrain-backend
    image: gentrain-backend
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - type: bind
        source: ./backend
        target: /backend
    depends_on:
      - redis
      - db
    env_file: ".env"
  worker:
    container_name: gentrain-worker
    image: gentrain-backend:latest
    depends_on:
      - redis
    entrypoint: /backend/entrypoint-worker.sh
    volumes:
      - type: bind
        source: ./backend
        target: /backend
    links:
      - redis
    env_file: ".env"
volumes:
  postgres_data:
