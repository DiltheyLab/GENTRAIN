services:
  redis:
    container_name: gentrain-redis
    image: "redis:alpine"
    ports:
      - 6379:6379

  backend:
    container_name: gentrain-backend
    image: gentrain-backend
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/backend
    depends_on:
      - redis
    env_file: "./backend/.env"

  worker:
    container_name: gentrain-worker
    image: gentrain-backend:latest
    depends_on:
      - redis
    command: [ "supervisord", "-c", "/backend/supervisor_dev.conf" ]
    links:
      - redis
