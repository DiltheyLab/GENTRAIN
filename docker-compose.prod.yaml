services:
  init:
    image: ubuntu:20.04
    volumes:
      - type: volume
        source: api_data
        target: /api_data
    entrypoint: /bin/bash -c "addgroup -g 1001 gentrain && adduser -D -G gentrain -u 1001 gentrain && chown -R gentrain:gentrain /api_data && exit"
    user: root
    networks:
      - caddy
  # The caddy-init-container adjusts permissions for caddy
  # container volumes to enable non-root container start up.
  caddy-init:
    image: caddy:latest
    volumes:
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
      - type: bind
        source: ./caddy/certs
        target: /certs
    networks:
      - caddy
    entrypoint:
      - sh
      - -c
      - |
        chown -R 65534:65534 /data /config /certs
  caddy:
    container_name: gentrain-caddy
    # Use the caddy:latest image from Docker Hub
    image: caddy:latest
    # Use nobody user
    user: 65534:65534
    # Restart policy: restart the container unless explicitly stopped
    restart: unless-stopped
    # ports for Caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the host Caddyfile
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ./frontend/dist # Mount the build directory of the frontend so Caddy can serve the static files
        target: /srv
        read_only: true
      - type: bind
        source: ./caddy/certs
        target: /certs
        read_only: true
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    networks:
      - caddy
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started

  redis:
    container_name: gentrain-redis
    image: gentrain-redis
    build:
      context: ./backend/redis
      dockerfile: Dockerfile.prod
    expose:
      - "${REDIS_PORT}"
    networks:
      - caddy

  db:
    container_name: gentrain-db
    image: postgres
    user: postgres:postgres
    hostname: localhost
    expose:
      - "${DATABASE_PORT}"
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - caddy

  api:
    container_name: gentrain-api
    image: gentrain-api
    restart: unless-stopped
    depends_on:
      - redis
      - db
      - init
    volumes:
      - type: volume
        source: api_data
        target: /api/data
      - type: bind
        source: ./backend/admin/prisma
        target: /api/prisma
    build:
      context: ./backend/api
      dockerfile: Dockerfile.prod
    expose:
      - "8080"
    env_file: ".env"
    environment:
      - DATABASE_URL=${DATABASE_DRIVER}://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    networks:
      - caddy
  worker:
    container_name: gentrain-worker
    image: gentrain-api:latest
    depends_on:
      - redis
    volumes:
      - type: volume
        source: api_data
        target: /api/data
      - type: bind
        source: ./backend/admin/prisma
        target: /api/prisma
    entrypoint: "/api/entrypoint-worker.sh prod"
    links:
      - redis
      - init
    env_file: ".env"
    environment:
      - DATABASE_URL=${DATABASE_DRIVER}://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    networks:
      - caddy
  admin:
    container_name: gentrain-admin
    image: gentrain-admin
    build:
      context: ./backend/admin
      dockerfile: Dockerfile.prod
    volumes:
      - type: volume
        source: api_data
        target: /admin/data
    expose:
      - "4001"
    depends_on:
      - db
      - init
    env_file: ".env"
    environment:
      - DATABASE_URL=${DATABASE_DRIVER}://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=disable
    networks:
      - caddy
  frontend:
    container_name: gentrain-frontend
    image: gentrain-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes:
      - type: bind # Mount the dist directory to the frontend service
        source: ./frontend/dist
        target: /app/dist
    networks:
      - caddy
    env_file: ".env"
    depends_on:
      api:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  api_data:

networks:
  # Docker network for Caddy
  caddy:
