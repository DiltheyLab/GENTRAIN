[supervisord]
nodaemon=true

[program:clamd]
directory=/
command=clamd &
autostart=true
autorestart=false
stderr_logfile=/admin/logs/clamd.err.log
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
user=gentrain

[program:admin]
directory=/admin
command=npm run start
autostart=true
autorestart=true
stderr_logfile=/admin/logs/admin.err.log
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
user=gentrain
