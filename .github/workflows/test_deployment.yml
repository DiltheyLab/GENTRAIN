on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  frontend_build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.10.0"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run Unit tests
        run: |
          cd frontend
          npx vitest --coverage.enabled true
      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: frontend
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Notify Slack Action Success
        uses: ravsamhq/notify-slack-action@2.3.0
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        if: always()
        with:
          status: ${{ job.status }}
          notify_when: "failure"
          notification_title: "Frontend Build"
          icon_failure: 💥

  pull_testing_state:
    name: Pull Testing State
    runs-on: ubuntu-latest
    needs: frontend_build

    steps:
      - name: Pull latest version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TEST_SERVER }}
          port: ${{ vars.SSH_PORT_TEST_SERVER }}
          script_stop: true
          script: |
            cd ${{ vars.GENTRAIN_DIR }}
            git fetch
            git checkout ${{ vars.TESTING_BRANCH }}
            git pull
            exit
      - name: Notify Slack Action Success
        uses: ravsamhq/notify-slack-action@2.3.0
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        if: always()
        with:
          status: ${{ job.status }}
          notify_when: "failure"
          notification_title: "Pull Testing State"
          icon_failure: 💥

  documentation_build:
    name: Documentation Build
    runs-on: ubuntu-latest
    needs: pull_testing_state

    steps:
      - name: Create, activate virtual environment and build mkdocs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TEST_SERVER }}
          port: ${{ vars.SSH_PORT_TEST_SERVER }}
          script_stop: true
          script: |
            cd ${{ vars.GENTRAIN_DIR }}/documentation
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            mkdocs build
      - name: Clear docs static files and move new build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TEST_SERVER }}
          port: ${{ vars.SSH_PORT_TEST_SERVER }}
          script_stop: true
          script: |
            rm -rf ${{ vars.GENTRAIN_DIR }}/backend/static/docs
            mkdir ${{ vars.GENTRAIN_DIR }}/backend/static/docs
            mv ${{ vars.GENTRAIN_DIR }}/documentation/site/* ${{ vars.GENTRAIN_DIR }}/backend/static/docs

  restart_docker_containers:
    name: Restart Docker Containers
    runs-on: ubuntu-latest
    needs: pull_testing_state

    steps:
      - name: Generate environment variables
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TEST_SERVER }}
          port: ${{ vars.SSH_PORT_TEST_SERVER }}
          script_stop: true
          script: |
            cd ${{ vars.GENTRAIN_DIR }}
            rm -f .env
            touch .env
            echo -e "VITE_API_HOST=${{vars.API_HOST}}:${{vars.HTTPS_PORT_TEST_SERVER}}" >> .env
            echo -e "APP_ENV=${{vars.TEST_APP_ENV}}" >> .env
            echo -e "APP_URL=${{vars.APP_URL}}" >> .env
            echo -e "REDIS_HOST=${{vars.REDIS_HOST}}" >> .env
            echo -e "REDIS_PORT=${{vars.REDIS_PORT}}" >> .env
            echo -e "REDIS_USERNAME=${{vars.REDIS_USERNAME}}" >> .env
            echo -e "REDIS_PASSWORD=${{secrets.REDIS_PASSWORD}}" >> .env
            echo -e "DATABASE_DRIVER=${{vars.DATABASE_DRIVER}}" >> .env
            echo -e "DATABASE_NAME=${{vars.DATABASE_NAME}}" >> .env
            echo -e "DATABASE_HOST=${{vars.DATABASE_HOST}}" >> .env
            echo -e "DATABASE_PORT=${{vars.DATABASE_PORT}}" >> .env
            echo -e "DATABASE_USER=${{vars.DATABASE_USER}}" >> .env
            echo -e "DATABASE_PASSWORD=${{secrets.DATABASE_PASSWORD}}" >> .env
            echo -e "DEFAULT_ADMIN_USERNAME=${{vars.DEFAULT_ADMIN_USERNAME}}" >> .env
            echo -e "DEFAULT_ADMIN_PASSWORD=${{secrets.DEFAULT_ADMIN_PASSWORD}}" >> .env
            echo -e "COOKIE_SECRET=${{secrets.COOKIE_SECRET}}" >> .env
            echo -e "SESSION_SECRET=${{secrets.SESSION_SECRET}}" >> .env
            echo -e "ADMIN_PANEL_URL=${{vars.ADMIN_PANEL_URL}}" >> .env
            echo -e "ADMIN_PANEL_PORT=${{vars.ADMIN_PANEL_PORT}}" >> .env
            echo -e "ADMIN_SCHEME_DIRECTORY=${{vars.ADMIN_SCHEME_DIRECTORY}}" >> .env
            echo -e "ADMIN_HTBASIC_USERNAME=${{vars.ADMIN_HTBASIC_USERNAME}}" >> .env
            echo -e "ADMIN_HTBASIC_PASSWORD=${{secrets.TEST_ADMIN_HTBASIC_PASSWORD}}" >> .env
            exit
      - name: Restart docker containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TEST_SERVER }}
          port: ${{ vars.SSH_PORT_TEST_SERVER }}
          script_stop: true
          script: |
            cd ${{ vars.GENTRAIN_DIR }}
            echo ${{ secrets.GENTRAIN_PASSWORD_TEST_SERVER }} | sudo -S docker compose -f docker-compose.prod.yaml down
            echo ${{ secrets.GENTRAIN_PASSWORD_TEST_SERVER }} | sudo -S docker system prune -f
            echo ${{ secrets.GENTRAIN_PASSWORD_TEST_SERVER }} | sudo -S docker compose -f docker-compose.prod.yaml build --build-arg USER_ID=$(id -u) --build-arg GROUP_ID=$(id -g)
            echo ${{ secrets.GENTRAIN_PASSWORD_TEST_SERVER }} | sudo -S docker compose -f docker-compose.prod.yaml up -d
            exit
      - name: Notify Slack Action Success
        uses: ravsamhq/notify-slack-action@2.3.0
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        if: always()
        with:
          status: ${{ job.status }}
          notify_when: "failure"
          notification_title: "Restart Docker Container"
          icon_failure: 💥
      - name: Notify Slack Action Success
        uses: ravsamhq/notify-slack-action@2.3.0
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        if: always()
        with:
          status: ${{ job.status }}
          notify_when: "success"
          notification_title: "Testing Deployment"
          icon_success: 🚀
