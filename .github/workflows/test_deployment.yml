name: Testing
on:
  push:
    branches:
      - e2e-testing

  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.test.yaml
  COMPOSE_ENV_FILES: .env.test

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npx vitest --coverage.enabled true

      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: frontend

  build_and_e2e_test:
    name: Build and E2E Test
    runs-on: ubuntu-24.04 # Server Version
    timeout-minutes: 30
    needs: unit_tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/dotnet
          docker system prune -af --volumes || true
          sudo rm -rf /opt/conda/pkgs/* || true

      - name: Build Docker images
        run: |
          docker compose build --no-cache
          docker compose --profile testing build e2e-tests

      - name: Start services
        run: |
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be ready..."

          echo "127.0.0.1 app.localhost admin.localhost api.localhost docs.localhost" | sudo tee -a /etc/hosts

          echo "Checking frontend..."
          timeout 240 bash -c 'until curl -sSf -k https://app.localhost > /dev/null 2>&1; do echo "Waiting for frontend..."; sleep 3; done'
          echo "Frontend is ready"

          echo "Checking documentation..."
          timeout 240 bash -c 'until curl -sSf -k https://docs.localhost > /dev/null 2>&1; do echo "Waiting for documentation..."; sleep 3; done'
          echo "Documentation is ready"

          echo "Checking admin..."
          timeout 240 bash -c 'until curl -sSf -k https://admin.localhost > /dev/null 2>&1; do echo "Waiting for admin..."; sleep 3; done'
          echo "Admin is ready"

          echo "Checking API..."
          timeout 240 bash -c 'until curl -sSf -k https://api.localhost/pathogens > /dev/null 2>&1; do echo "Waiting for API..."; sleep 3; done'
          echo "API is ready"

          echo "All services are ready!"
          docker compose ps

      - name: Run Cypress E2E tests
        run: |
          docker compose --profile testing run --rm e2e-tests
        continue-on-error: false

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== API Logs ==="
          docker compose logs api --tail=100
          echo "=== Admin Logs ==="
          docker compose logs admin --tail=100
          echo "=== Caddy Logs ==="
          docker compose logs caddy --tail=100
          echo "=== Worker Logs ==="
          docker compose logs worker --tail=100
          echo "=== E2E Test Logs ==="
          docker compose logs e2e-tests --tail=100
          echo "=== Frontend Logs ==="
          docker compose logs frontend --tail=100
          echo "=== Documentation Logs ==="
          docker compose logs documentation --tail=100

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: e2e-tests/cypress/videos/**/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: e2e-tests/cypress/screenshots/**/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Shut down containers
        if: always()
        run: docker compose down -v --remove-orphans

  notify:
    name: Notify
    needs: [unit_tests, build_and_e2e_test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Slack
        uses: ravsamhq/notify-slack-action@2.3.0
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        with:
          status: ${{ (needs.unit_tests.result == 'success' && needs.build_and_e2e_test.result == 'success') && 'success' || 'failure' }}
          notify_when: "success,failure"
          notification_title: "Test Pipeline"
          icon_success: 🚀
          icon_failure: 💥
