on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  frontend_build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.10.0"
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Notify Slack Action Success
        uses: ravsamhq/notify-slack-action@2.3.0
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        if: always()
        with:
          status: ${{ job.status }}
          notify_when: "failure"
          notification_title: "Frontend Build"
          icon_failure: 💥

  pull_production_state:
    name: Pull Production State
    runs-on: ubuntu-latest
    needs: frontend_build

    steps:
      - name: Pull latest version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ${{ vars.GENTRAIN_DIR }}
            git checkout ${{ vars.PRODUCTION_BRANCH }}
            git pull
            exit
      - name: Notify Slack Action Success
        uses: ravsamhq/notify-slack-action@2.3.0
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        if: always()
        with:
          status: ${{ job.status }}
          notify_when: "failure"
          notification_title: "Pull Production State"
          icon_failure: 💥

  restart_docker_containers:
    name: Restart Docker Containers
    runs-on: ubuntu-latest
    needs: pull_production_state

    steps:
      - name: Generate environment variables
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ${{ vars.GENTRAIN_DIR }}
            rm -f .env
            touch .env
            echo -e "VITE_HTBASIC_USERNAME=${{vars.HTBASIC_USERNAME}}" >> .env
            echo -e "VITE_HTBASIC_PASSWORD=${{secrets.HTBASIC_PASSWORD}}" >> .env
            echo -e "VITE_APP_PUBLIC_POSTHOG_HOST=${{vars.VITE_APP_PUBLIC_POSTHOG_HOST}}" >> .env
            echo -e "VITE_APP_PUBLIC_POSTHOG_KEY=${{secrets.VITE_APP_PUBLIC_POSTHOG_KEY}}" >> .env
            echo -e "VITE_API_HOST=${{vars.API_HOST}}" >> .env
            echo -e "VITE_ENABLE_WEBSOCKETS=${{vars.ENABLE_WEBSOCKETS}}" >> .env
            echo -e "APP_ENV=${{vars.PROD_APP_ENV}}" >> .env
            echo -e "SECRET_KEY=${{secrets.SECRET_KEY}}" >> .env
            echo -e "REDIS_HOST=${{vars.REDIS_HOST}}" >> .env
            echo -e "REDIS_PORT=${{vars.REDIS_PORT}}" >> .env
            echo -e "REDIS_USERNAME=${{vars.REDIS_USERNAME}}" >> .env
            echo -e "REDIS_PASSWORD=${{secrets.REDIS_PASSWORD}}" >> .env
            echo -e "ADMIN_EMAIL=${{vars.ADMIN_EMAIL}}" >> .env
            echo -e "ADMIN_PASSWORD=${{secrets.ADMIN_PASSWORD}}" >> .env
            echo -e "DATABASE_DRIVER=${{vars.DATABASE_DRIVER}}" >> .env
            echo -e "DATABASE_NAME=${{vars.DATABASE_NAME}}" >> .env
            echo -e "DATABASE_HOST=${{vars.DATABASE_HOST}}" >> .env
            echo -e "DATABASE_PORT=${{vars.DATABASE_PORT}}" >> .env
            echo -e "DATABASE_USER=${{vars.DATABASE_USER}}" >> .env
            echo -e "DATABASE_PASSWORD=${{secrets.DATABASE_PASSWORD}}" >> .env
            echo -e "ADMIN_HTBASIC_USERNAME=${{vars.ADMIN_HTBASIC_USERNAME}}" >> .env
            echo -e "ADMIN_HTBASIC_PASSWORD=${{secrets.PROD_ADMIN_HTBASIC_PASSWORD}}" >> .env
            exit
      - name: Restart docker containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ${{ vars.GENTRAIN_DIR }}
            echo ${{ secrets.GENTRAIN_PASSWORD }} | sudo -S docker compose -f docker-compose.prod.yaml down
            echo ${{ secrets.GENTRAIN_PASSWORD }} | sudo -S docker system prune -f
            echo ${{ secrets.GENTRAIN_PASSWORD }} | sudo -S sh redis/gen-certs.sh
            echo ${{ secrets.GENTRAIN_PASSWORD }} | sudo -S docker compose -f docker-compose.prod.yaml build --no-cache --build-arg USER_ID=$(id -u) --build-arg GROUP_ID=$(id -g)
            echo ${{ secrets.GENTRAIN_PASSWORD }} | sudo -S docker compose -f docker-compose.prod.yaml up -d
            exit
      - name: Notify Slack Action Success
        uses: ravsamhq/notify-slack-action@2.3.0
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        if: always()
        with:
          status: ${{ job.status }}
          notify_when: "failure"
          notification_title: "Restart Docker Container"
          icon_failure: 💥
      - name: Notify Slack Action Success
        uses: ravsamhq/notify-slack-action@2.3.0
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        if: always()
        with:
          status: ${{ job.status }}
          notify_when: "success"
          notification_title: "Production Deployment"
          icon_success: 🚀
