on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run_pull:
    name: run pull
    runs-on: ubuntu-latest

    steps:
      - name: Make envfile
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_SECRET_KEY: ${{ secrets.HTBASIC_PASSWORD }}
          envkey_VARIABLE: ${{ vars.HTBASIC_USERNAME }}
          directory: /frontend
          file_name: .env
          fail_on_empty: false
          sort_keys: false
      - name: connect and pull
        uses: appleboy/ssh-action@v1.0.3
        env:
          GENTRAIN_DIR: ${{ secrets.GENTRAIN_DIR }}
          GENTRAIN_PASSWORD: ${{ secrets.GENTRAIN_PASSWORD }}
          MAIN_BRANCH: ${{ secrets.MAIN_BRANCH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GENTRAIN_DIR,GENTRAIN_PASSWORD,MAIN_BRANCH
          script: |
            cd ${{ secrets.GENTRAIN_DIR }}
            git checkout ${{ secrets.MAIN_BRANCH }}
            git pull
            echo ${{ secrets.GENTRAIN_PASSWORD }} | sudo -S docker compose -f docker-compose.prod.yaml stop
            echo ${{ secrets.GENTRAIN_PASSWORD }} | sudo -S docker compose -f docker-compose.prod.yaml up -d --no-deps --build
            exit
