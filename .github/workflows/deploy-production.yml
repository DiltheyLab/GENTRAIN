on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run_pull:
    name: run pull
    runs-on: ubuntu-latest

    steps:
      - name: install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
      - name: connect and pull
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.GENTRAIN_DIR }} && git checkout ${{ secrets.MAIN_BRANCH }} && git pull && docker compose stop -f docker-compose.prod.yaml && docker compose up -f docker-compose.prod.yaml -d --no-deps --build && exit"
      - name: cleanup
        run: rm -rf ~/.ssh
