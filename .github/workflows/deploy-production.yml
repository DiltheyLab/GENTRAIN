on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run_pull:
    name: run pull
    runs-on: ubuntu-latest

    steps:
      - name: install ssh keys
        run: |
          apt-get install sshpass
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
      - name: connect and pull
        run: sshpass -p {{SECRETS.GENTRAIN_PASSWORD}} ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.GENTRAIN_DIR }} && git checkout ${{ secrets.MAIN_BRANCH }} && git pull && docker-compose stop && docker-compose up -d --no-deps --build && exit"
      - name: cleanup
        run: rm -rf ~/.ssh
